function loadHist(k,more){if(!(F.ws&&F.ws.readyState==1&&F.ready)||F.ld[k])return;const a=C[k]||[];if(more&&(!a.length||F.ce[k]))return;F.ld[k]=1;setTimeout(()=>{F.ld[k]=0},12000);
try{F.ws.send(JSON.stringify({ticks_history:F.sym[k]||DM[k][0],style:'candles',granularity:60,count:1000,end:more?String(a[0].t-1):'latest',passthrough:{k,kind:more?'more':'hist'},req_id:200+K.indexOf(k)}))}catch(_){F.ld[k]=0}}
function fretry(){F.try++;F.ep++;clearTimeout(F.to);F.to=setTimeout(fconn,Math.min(15000,1500*F.try))}
function fconn(){clearTimeout(F.to);F.st='connecting';let ws;try{ws=new WebSocket(EP[F.ep%EP.length])}catch(e){return fretry()}
F.ws=ws;let done=0,rt;
const subs=()=>{if(done||ws.readyState!=1)return;done=1;clearTimeout(rt);F.ready=1;K.forEach((k,i)=>{ws.send(JSON.stringify({ticks:F.sym[k]||DM[k][0],subscribe:1,req_id:i+1}));ws.send(JSON.stringify({ticks_history:F.sym[k]||DM[k][0],style:'candles',granularity:60,end:'latest',count:2,subscribe:1,passthrough:{k,kind:'live'},req_id:50+i}))});loadHist(ci)};
ws.onopen=()=>{F.st='open';F.try=0;ws.send(JSON.stringify({active_symbols:'brief',req_id:100}));rt=setTimeout(subs,3000);clearInterval(F.pg);F.pg=setInterval(()=>{ws.readyState==1&&ws.send(JSON.stringify({ping:1}))},30000)};
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
if(m.msg_type=='active_symbols'&&Array.isArray(m.active_symbols)){const a=m.active_symbols.map(s=>({n:s.underlying_symbol||s.symbol||'',d:[s.display_name,s.underlying_symbol_display_name,s.symbol_display_name].filter(Boolean).join(' ')}));
K.forEach(k=>{const c=a.find(s=>DM[k].includes(s.n))||a.find(s=>/^(frx|cry|OTC_)/.test(s.n)&&DN[k].test(s.d));if(c)F.sym[k]=c.n});subs();return}
if(m.error){const er=m.echo_req||{},q=er.ticks||er.ticks_history,k=q&&K.find(x=>(F.sym[x]||DM[x][0])==q);if(k){F.err[k]=m.error.message||m.error.code||'error';if(er.ticks_history){F.ld[k]=0;if((er.passthrough||{}).kind=='more')F.ce[k]=1}}return}
if(m.msg_type=='candles'&&Array.isArray(m.candles)){const ps=(m.echo_req&&m.echo_req.passthrough)||{},k=ps.k;if(!k||!X[k])return;const h=X[k].sp/2,add=mergeC(k,m.candles.map(c=>({t:+c.epoch,o:+c.open-h,h:+c.high-h,l:+c.low-h,c:+c.close-h})).filter(c=>c.t>0&&c.c>0));if(ps.kind=='live')F.oh[k]=Date.now();else{F.ld[k]=0;if(ps.kind=='more'&&!add)F.ce[k]=1}if(k==ci)ch();return}
if(m.msg_type=='ohlc'&&m.ohlc){const o=m.ohlc,k=rev()[o.symbol];if(!k)return;const h=X[k].sp/2;upsert(k,{t:+o.open_time,o:+o.open-h,h:+o.high-h,l:+o.low-h,c:+o.close-h});F.oh[k]=Date.now();if(k==ci)ch();return}
if(m.msg_type=='tick'&&m.tick){const t=m.tick,k=rev()[t.symbol||t.underlying_symbol];if(!k)return;
const b=+t.bid,a=+t.ask,q=+t.quote,mid=(b>0&&a>0)?(a+b)/2:(q>0?q:0);if(!(mid>0))return;
const px=mid-X[k].sp/2;F.any=1;F.ts[k]=Date.now();delete F.err[k];Bd[k]=px;tickC(k,px,+t.epoch)}};
ws.onclose=()=>{clearInterval(F.pg);clearTimeout(rt);F.st='down';if(F.ws===ws){F.ready=0;fretry()}};
ws.onerror=()=>{try{ws.close()}catch(x){}}}
function fs(){const e=$('fd');if(!e)return;const n=K.filter(fresh).length;let t,c;
if(!F.any){t=F.st=='open'?'Deriv connected, waiting for prices · trading paused':'Deriv unreachable · retrying · trading paused';c='var(--am)'}
else{const bad=K.filter(k=>!fresh(k));t='Deriv LIVE '+n+'/'+K.length+(bad.length?' · no live ticks (closed?): '+bad.join(', '):'');c=bad.length?'var(--am)':'var(--gn)'}
e.innerHTML='<span style="color:'+c+'">●</span> '+t;const f2=$('fs2');if(f2)f2.textContent=t}
// ---- MT5-style chart gestures: drag = scroll, pinch / wheel = zoom, tap = candle info ----
(function(){const w=$('chw'),pt=new Map();let g=null;
const xr=()=>w.clientWidth-AX-6,fr=()=>{if(!V.raf)V.raf=requestAnimationFrame(()=>{V.raf=0;ch()})},rp=e=>{const r=w.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const startD=p=>({m:'d',p0:V.p,sx:p.x,sy:p.y,t:Date.now(),mv:0}),startZ=()=>{const [a,b]=[...pt.values()],n=(C[ci]||[]).length,cx=(a.x+b.x)/2;return{m:'z',d:Math.hypot(a.x-b.x,a.y-b.y)||1,bw:V.bw,i0:n-1+V.p-(xr()-cx)/V.bw,mv:1}};
w.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;try{w.setPointerCapture(e.pointerId)}catch(_){}pt.set(e.pointerId,rp(e));g=pt.size==1?startD(pt.get(e.pointerId)):pt.size==2?startZ():g});
w.addEventListener('pointermove',e=>{const q=pt.get(e.pointerId);if(!q||!g)return;Object.assign(q,rp(e));const n=(C[ci]||[]).length;
if(g.m=='z'&&pt.size>=2){const [a,b]=[...pt.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,nb=Math.min(40,Math.max(1.5,g.bw*d/g.d));V.bw=nb;V.p=(xr()-cx)/nb-(n-1-g.i0);fr()}
else if(g.m=='d'&&pt.size==1){if(Math.abs(q.x-g.sx)>5||Math.abs(q.y-g.sy)>5)g.mv=1;V.p=g.p0-(q.x-g.sx)/V.bw;fr()}});
const up=e=>{if(!pt.has(e.pointerId))return;const q=pt.get(e.pointerId);pt.delete(e.pointerId);if(!g)return;
if(g.m=='d'&&!g.mv&&e.type=='pointerup'&&Date.now()-g.t<450){const a=C[ci]||[],i=Math.round(a.length-1+V.p-(xr()-q.x)/V.bw);V.sel=(i>=0&&i<a.length&&a[i].t!=V.sel)?a[i].t:0;fr()}
if(pt.size==1){g=startD([...pt.values()][0]);g.mv=1}else if(!pt.size)g=null};
w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
w.addEventListener('wheel',e=>{e.preventDefault();const n=(C[ci]||[]).length,q=rp(e);if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){V.p-=e.deltaX/V.bw;return fr()}
const i0=n-1+V.p-(xr()-q.x)/V.bw,nb=Math.min(40,Math.max(1.5,V.bw*Math.exp(-e.deltaY*.0015)));V.bw=nb;V.p=(xr()-q.x)/nb-(n-1-i0);fr()},{passive:false})})();
fconn();
render();PS();SU();U();fs();setInterval(tick,1000);addEventListener('resize',U);document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{if(F.ws&&F.ws.readyState>1)fconn()}catch(_){}tick()}});
